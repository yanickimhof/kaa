[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaa"
version = "0.1.0"
description = "Sovereign home network security analyzer. Maps every device, explains what is wrong, runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "zeroconf>=0.130",
  "truststore>=0.9",
  "rumps>=0.4; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kaa = "kaa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaa"]
# Ship the web UI and signature data even if a global gitignore would hide them.
artifacts = ["src/kaa/web/*", "src/kaa/data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
