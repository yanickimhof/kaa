<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Kaa</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="logo.svg" alt="" width="24" height="24">
      <span class="name">Kaa</span>
      <span class="chip mono" id="scope"></span>
    </div>
    <div class="bar-right">
      <span class="status" id="status"><i class="dot"></i><span id="status-text"></span></span>
      <button id="scan" class="ib" data-tt="scan_tip"></button>
      <button id="deep" class="ib" data-tt="deep_tip"></button>
      <i class="sep" aria-hidden="true"></i>
      <button id="settings" class="ib" data-tt="settings"></button>
      <button id="lang" class="ib" data-tt="s_lang"></button>
      <button id="theme" class="ib" data-tt="theme"></button>
    </div>
  </header>

  <main class="grid">
    <aside class="col-left">
      <section class="card score">
        <div class="ring-wrap">
          <svg viewBox="0 0 140 140" class="ring" aria-hidden="true">
            <circle cx="70" cy="70" r="58" class="ring-bg"/>
            <circle cx="70" cy="70" r="58" class="ring-fg" id="ring" transform="rotate(-90 70 70)"/>
          </svg>
          <div class="ring-text"><div class="num" id="score">–</div><div class="grade" id="grade"></div></div>
        </div>
        <div class="kline" id="kline"></div>
        <div class="trend" data-tt="trend_tip">
          <svg class="spark" id="spark" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="trend-l"><span id="t-min"></span><span id="t-delta"></span><span id="t-max"></span></div>
        </div>
        <div id="digest" class="digest"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2><span data-t="hygiene"></span></h2></div>
        <div id="hygiene" class="hy"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2><span data-t="actions"></span></h2></div>
        <div id="actions" class="actions"></div>
      </section>

    </aside>

    <section class="col-right">
      <section class="card">
        <div class="card-head"><h2><span data-t="ai_analyst"></span></h2>
          <button id="brief" class="link" data-tt="ai_brief_tip"></button></div>
        <form id="ask" class="ask"><input id="ask-q" class="search" autocomplete="off" data-ph="ai_placeholder"><button class="ib" id="ask-go" data-tt="ask_btn"></button></form>
        <div id="ai" class="ai"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2><span data-t="internet"></span></h2>
          <button id="speed" class="link" data-tt="net_run"></button></div>
        <div id="net" class="net"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2><span data-t="devices"></span></h2>
          <input id="q" class="search" type="search" data-ph="search" autocomplete="off">
        </div>
        <div id="chips" class="chips"></div>
        <div id="map" class="dlist"></div>
      </section>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <script src="app.js" type="module"></script>
</body>
</html>
